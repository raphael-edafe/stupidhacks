[package]
name = "game"
version.workspace = true
edition.workspace = true

[dependencies]
minifb = { version = "0.29.0", optional = true }
png = { version = "0.18.1", optional = true }
shared = { path = "../shared" }

[features]
default = ["preview"]
# The standalone preview window + headless screenshots. The compositor depends
# on this crate with default-features = false so it doesn't pull these in.
preview = ["dep:minifb", "dep:png"]

[[bin]]
name = "preview"
path = "src/bin/preview.rs"
required-features = ["preview"]
