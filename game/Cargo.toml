[package]
name = "game"
version.workspace = true
edition.workspace = true

[dependencies]
minifb = { version = "0.29.0", optional = true }
# Installed-app catalog for the preview's launcher (the compositor scans its own).
apps = { path = "../apps", optional = true }
# Decodes the embedded sprite PNGs at startup (and writes --shots in the preview).
png = "0.18.1"
shared = { path = "../shared" }

[features]
default = ["preview"]
# The standalone preview window + headless screenshots. The compositor depends
# on this crate with default-features = false so it doesn't pull minifb in.
preview = ["dep:minifb", "dep:apps"]

[[bin]]
name = "preview"
path = "src/bin/preview.rs"
required-features = ["preview"]
